<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="./style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="main-container">
    <header class="input-container">
      <input class="city-input" placeholder="Search city" type="text" />
      <button class="search-btn">
        <span class="material-symbols-outlined">search</span>
      </button>
    </header>

    <section class="weather-info" style="display: none;">
      <div class="location-date-container">
        <div class="location">
          <span class="material-symbols-outlined">location_on</span>
          <h4 class="country-txt">bangaluru  india</h4>
        </div>
        <h5 class="current-date-txt regular-txt">Mon, 21 october</h5>
      </div> 

      <div class="weather-summary-container">
        <img src="./clouds.svg" alt="" class="weather-summary-img" />
        <div class="weather-summary-info">
          <h1 class="temp-txt">28°C</h1>
          <h3 class="condition-txt regular-txt">Clouds</h3>
        </div>
      </div>

      <div class="weather-condition-container">
        <div class="condition-item">
          <div class="condition-info">
            <h5 class="regular-txt">Humidity</h5>
            <h5 class="humidity-value-txt">56%</h5>
          </div>
        </div>
        <div class="condition-item">
          <div class="condition-info">
            <h5 class="regular-txt">Wind Speed</h5>
            <h5 class="wind-value-txt">4 M/s</h5>
          </div>
        </div>
      </div>

      <div class="forecast-items-container">
        <!-- JS will add forecast items here -->
      </div>
    </section>

    <section class="search-city section-message">
      <img src="./search-city.png" alt="" />
      <div>
        <h1>Search City</h1>
        <h4 class="regular-txt">Find out the weather condition of the city</h4>
      </div>
    </section>

    <section class="not-found section-message" style="display: none;">
      <img src="./not-found.png" alt="" />
      <div>
        <h1>City Not Found</h1>
        <h4 class="regular-txt">Please enter a valid city name</h4>
      </div>
    </section>
  </main>
</body>
</html>
